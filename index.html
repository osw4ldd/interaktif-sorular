 version control history support security review?", "o": ["It guarantees that attackers cannot edit code", "It automatically removes vulnerabilities", "It encrypts the source code", "It helps identify the change that introduced a weakness"], "a": 3, "e": "History lets reviewers find when and where a weakness appeared."}, {"s": "Which statement about tracking changes and safety is correct?", "o": ["A commit message guarantees the code was reviewed", "Only private repositories can contain weaknesses", "Tracking supports security review but does not prove safety", "Tracked code is always safe"], "a": 2, "e": "Version control is a tool for review, not a proof of safety."}, {"s": "A diff shows that a permission check was removed. Why does this matter?", "o": ["Removed lines are never important", "It proves that all tests passed", "Diffs expose sensitive edits like this so reviewers can question them", "Git hides such edits from reviewers"], "a": 2, "e": "Reading the diff lets reviewers spot risky changes."}, {"s": "What is a software patch?", "o": ["A backup copy of the repository", "A tool that deletes old commits", "A new GitHub account", "A change that repairs a problem or updates behaviour"], "a": 3, "e": "A patch repairs a problem or updates behaviour."}, {"s": "Restoring `>= 50` in the grade calculator is which kind of patch?", "o": ["Bug fix", "Security fix", "Performance fix", "Compatibility fix"], "a": 0, "e": "It repairs incorrect behaviour (the 50-point pass rule)."}, {"s": "Checking permission before edits is an example of which patch purpose?", "o": ["Security fix", "Compatibility fix", "Bug fix", "Performance fix"], "a": 0, "e": "A security fix addresses an exploitable weakness."}, {"s": "What brings a patch to the users?", "o": ["Creating a fork", "Release or deployment", "Writing the commit message", "Running `git status`"], "a": 1, "e": "Release or deployment delivers the patch to users."}]}, {"t": "GitHub & Project Roles", "q": [{"s": "Which statement c if their tests pass"], "a": 1, "e": "A contribution does not automatically grant permission to change the project."}]}, {"t": "Supply Chain Security", "q": [{"s": "What is the software supply chain?", "o": ["A list of GitHub users", "Only the servers that host a website", "Only the final app that users install", "The code and tools used to build and deliver software"], "a": 3, "e": "It covers all the code and tools involved in building and delivering software."}, {"s": "A useful-looking pull request hides harmful code. Which risk is this?", "o": ["Malicious contribution", "Compromised dependency", "Performance fix", "Merge conflict"], "a": 0, "e": "Accepting it can carry the harmful code into the next release."}, {"s": "Your own source files are unchanged, but an update of a reused library contains malicious code. Which risk is this?", "o": ["Compromised dependency", "Malicious contribution", "Stolen maintainer access", "Merge conflict"], "a": 0, "e": "The build becomes unsafe even though your files did not change."}, {"s": "An attacker uses a stolen account or token with write access to alter repository code. Which risk is this?", "o": ["Merge conflict", "Compromised dependency", "Regression", "Stolen maintainer access"], "a": 3, "e": "Write access lets the attacker alter code or release references."}, {"s": "Which controls reduce supply chain risks in project code?", "o": ["Giving every contributor admin rights", "Required reviews, dependency checks, and limited write permissions", "Skipping reviews to move faster", "Making all repositories public"], "a": 1, "e": "Review, dependency checks and least privilege are the controls."}, {"s": "A reused build step in your workflow runs malicious code and may expose secrets. Which risk is this?", "o": ["Unit test failure", "Untrusted code in a privileged workflow", "Merge conflict", "Compromised third-party Action"], "a": 3, "e": "A third-party Action runs inside your workflow with its access."}, {"s": "A badly configured o": ["Test the result and record the completed merge", "Force push without checking", "Fork the repository", "Assume it is correct and skip the tests"], "a": 0, "e": "An automatic or manual merge does not establish correctness."}]}, {"t": "Software Testing & AI Review", "q": [{"s": "What does the `-v` option in `python -m unittest -v` do?", "o": ["Skips tests that fail", "Verifies that the code is secure", "Validates the Git history", "Shows each test’s name and result in detail"], "a": 3, "e": "`-v` means verbose: each test and its result is listed."}, {"s": "In unittest results, how do FAIL and ERROR differ?", "o": ["FAIL: actual result differed from expected; ERROR: an unexpected error stopped the test", "FAIL means the test passed; ERROR means it was skipped", "They mean exactly the same thing", "ERROR means the result differed from expected; FAIL means a crash"], "a": 0, "e": "FAIL is a wrong result. ERROR is an unexpected problem that prevented the test from finishing."}, {"s": "Which test type checks that a change preserves previously expected behaviour?", "o": ["Clone test", "Regression test", "Integration test", "Unit test"], "a": 1, "e": "Regression tests protect behaviour that already worked."}, {"s": "Which test detects an incorrect change from `>= 50` to `> 50`?", "o": ["Midterm 50, final 50: expected 50, Pass", "Midterm 49, final 49: expected 49, Fail", "Midterm 0, final 0: expected 0, Fail", "Midterm 101, final 60: expected an input error"], "a": 0, "e": "Only the exact-threshold test behaves differently with `> 50`."}, {"s": "Overall = 0.40 × midterm + 0.60 × final. For midterm 80 and final 40, what is the expected result?", "o": ["56, Pass", "48, Fail", "60, Pass", "56, Fail"], "a": 0, "e": "0.40 × 80 + 0.60 × 40 = 32 + 24 = 56, and 56 ≥ 50."}, {"s": "What is the best way to review an AI-generated code change?", "o": ["Skip tests because an AI wrote the code", "Read only the AI’s summary", "Accept it if it runs once", "State requirements, inspect every changed file, test thresholds and invalid input, and explain the behaviour before accepting"], "a": 3, "e": "Check the diff against the task and test from the requirements."}]}]}];
const L='ABCDE',app=document.getElementById('app');
const E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/`([^`]+)`/g,'<code>$1</code>');
let cur=0,qs=[],i=0,ans=[],key='';
const total=c=>c.sections.reduce((n,s)=>n+s.q.length,0);
const best=k=>{try{return localStorage.getItem('b'+cur+'_'+k)}catch(e){return null}};
const setBest=(k,v)=>{try{localStorage.setItem('b'+cur+'_'+k,v)}catch(e){}};
const card=(k,t,n)=>{const b=best(k);return `<button class="sec" onclick="start('${k}')"><b>${E(t)}</b><span>${n} soru${b?' · en iyi: '+b+'/'+n:''}</span></button>`};

function intro(){
  qs=[];
  app.innerHTML=`<div class="intro"><h1>Osman Temel</h1><p class="who">RTEU Computer Engineering</p><p class="mu">Ders soru bankası · çoktan seçmeli, anında geri bildirim</p><button class="pri" onclick="courses()">Başla</button></div>`;
}
function courses(){
  qs=[];
  app.innerHTML=`<div class="top"><button class="ghost" onclick="intro()">← Giriş</button></div><h1>Dersler</h1><p class="mu">Bir ders seç.</p><div class="grid">`+
  C.map((c,k)=>`<button class="sec" onclick="home(${k})"><b>${E(c.name)}</b><span>${c.sections.length} bölüm · ${total(c)} soru</span></button>`).join('')+'</div>';
}
function home(c){
  if(c!==undefined)cur=c;qs=[];const c0=C[cur];
  app.innerHTML=`<div class="top"><button class="ghost" onclick="courses()">← Dersler</button></div><h1>${E(c0.name)}</h1><p class="mu">${E(c0.note)}</p>
  <label class="sh"><input type="checkbox" id="shuf"> Soruları karıştır</label><div class="grid">`+
  c0.sections.map((s,k)=>card(k,s.t,s.q.length)).join('')+card('all','Tüm sorular',total(c0))+'</div>';
}
function start(k){
  const S=C[cur].sections,sh=document.getElementById('shuf').checked;key=k;
  let a=k==='all'?S.flatMap((s,x)=>s.q.map((q,y)=>({...q,n:`${x+1}. bölüm · Soru ${y+1}`}))):S[k].q.map((q,y)=>({...q,n:`${S[k].t} · Soru ${y+1}`}));
  if(sh)a.sort(()=>Math.random()-.5);
  begin(a);
}
function begin(a){qs=a;i=0;ans=a.map(()=>-1);show()}
const nOk=()=>ans.filter((x,j)=>x===qs[j].a).length;
function show(){
  const q=qs[i],d=ans[i]>=0;
  app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">← Bölümler</button><span class="mu">${ans.filter(x=>x>=0).length}/${qs.length} cevaplandı · ${nOk()} doğru</span></div>
  <div class="dots">${qs.map((_,j)=>`<button class="dot ${j===i?'cur':''} ${ans[j]<0?'':ans[j]===qs[j].a?'ok':'no'}" onclick="go(${j})">${j+1}</button>`).join('')}</div>
  <div class="card"><div class="mu">${E(q.n)}</div><div class="stem">${E(q.s)}</div>
  ${q.o.map((o,j)=>`<button class="opt ${d?(j===q.a?'ok':j===ans[i]?'no':''):''}" ${d?'disabled':''} onclick="pick(${j})"><i>${L[j]}</i><span>${E(o)}</span></button>`).join('')}
  ${d?`<p class="fb ${ans[i]===q.a?'ok':'no'}">${ans[i]===q.a?'Doğru!':'Yanlış. Doğru cevap: '+L[q.a]}</p>${q.e?`<p class="exp">${E(q.e)}</p>`:''}`:''}</div>
  <div class="nav"><button class="ghost" onclick="go(i-1)" ${i?'':'disabled'}>← Önceki</button>${i<qs.length-1?'<button class="pri" onclick="go(i+1)">Sonraki →</button>':'<button class="pri" onclick="finish()">Bitir</button>'}</div>`;
}
function go(j){if(j>=0&&j<qs.length){i=j;show();window.scrollTo(0,0)}}
function pick(j){if(ans[i]<0){ans[i]=j;show()}}
function finish(){
  const n=qs.length,ok=nOk(),blank=ans.filter(x=>x<0).length;
  const old=+best(key)||0;if(ok>old&&!blank)setBest(key,ok);
  const wrong=qs.filter((q,j)=>ans[j]!==q.a);
  app.innerHTML=`<h1>Sonuç</h1><div class="big">${ok}/${n}</div><p class="mu">${blank?blank+' soru boş bırakıldı. ':''}%${Math.round(ok/n*100)} başarı</p>
  <div class="row"><button class="pri" onclick="begin(qs.map(q=>q))">Baştan başla</button>${wrong.length?'<button class="ghost" onclick="begin(wrongs())">Yanlışları tekrar çöz</button>':''}<button class="ghost" onclick="home()">Bölümler</button></div>`+
  (wrong.length?'<h2 style="font-size:18px">Yanlış ya da boş sorular</h2>'+qs.map((q,j)=>ans[j]===q.a?'':`<div class="wr"><div class="mu">${E(q.n)}</div>${E(q.s)}<br><b>Doğru: ${L[q.a]}) ${E(q.o[q.a])}</b></div>`).join(''):'<p>Hepsi doğru, tebrikler!</p>');
  window.scrollTo(0,0);
}
const wrongs=()=>qs.filter((q,j)=>ans[j]!==q.a);
document.addEventListener('keydown',e=>{
  if(!qs.length||!document.querySelector('.card'))return;
  const x='abcde'.indexOf(e.key.toLowerCase()),y='12345'.indexOf(e.key),k=x>=0?x:y;
  if(k>=0&&k<qs[i].o.length)pick(k);else if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);
});
intro();
</script></body></html>
