<style>

body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}

<script>
const D=[{"t": "Kavramlar: Darbe, İnkılap, Yönetim Biçimleri", "q": [{"s": "Aşağıdakilerden hangisi darbenin özelliklerinden biridir?", "o": ["Demokratik bir haktır.", "Darbe sonrası anayasal düzen değiştirilir.", "Devletin resmi bir kurumu tarafından yapılır.", "Beraberinde siyasi, sosyal ve ekonomik alanda köklü değişiklikler getirir.", "Hukuksal bir zeminde anayasaya uygun olarak yapılır."], "a": 2}, {"s": "Aşağıdakilerden hangisi “İnkılap”ın özelliklerinden biri değildir?", "o": ["Pek çok alanda köklü değişiklikler meydana getirir.", "Kurumlarda meydana gelen değişim kendiliğinden olacağı için, uzun bir zamana ihtiyaç vardır.", "Yenilikler konusunda halkın olgunlaşma düzeyi beklenmez.", "Uygulanmasında halka yönelik zor kullanım gerektirebilir.", "İlk aşamasında devlet yönetimindeki bozukluklara karşı muhalif fikirlerden oluşur."], "a": 1}, {"s": "İnkılabı ihtilâlden ayıran en önemli özellik aşağıdakilerden hangisidir?", "o": ["Halk tarafından yapılması", "Aksiyon safhasında hukuk dışı yollara başvurulması", "Siyasal değişim meydana getirmesi", "Sosyal, ekonomik ve kültürel değişiklikler içermesi", "Hükümet üyelerinin görevden alınması"], "a": 3}, {"s": "Halkın, devlet yönetimine seçtiği vekiller aracılığı ile katılması demokrasinin hangi türüdür?", "o": ["Çoğulcu Demokrasi", "Mutlak Demokrasi", "Doğrudan Demokrasi", "Yarı Doğrudan Demokrasi", "Temsili Demokrasi"], "a": 4}, {"s": "Monarkın yetkilerini bir kurulla paylaştığı yönetim biçimi aşağıdakilerden hangisidir?", "o": ["Meşruti Monarşi", "Mutlak Monarşi", "Oligarşi", "Demokrasi", "Aristokrasi"], "a": 0}, {"s": "Devlet yönetiminin bir gruba ait olduğu yönetim şekli aşağıdakilerden hangisi ile tanımlanır?", "o": ["Monarşi", "Demokrasi", "Meşruti Monarşi", "Oligarşi", "Cumhuriyet"], "a": 3}, {"s": "Cumhuriyet döneminde Türkiye’de yapılan yenilikler aşağıdakilerden hangisi vasıtasıyla yapılmıştır?", "o": ["Demokratik", "Devrim", "Evrim", "İsyan", "Uzlaşma"], "a": 1}, {"s": "Devlet yönetimini halkın tamamının üstlenmesi demokrasinin hangi türüdür?", "o": ["Doğrudan Demokrasi", "Yarı Doğrudan Demokrasi", "Temsili Demokrasi", "Nispi Demokrasi", "Cumhuriyet"], "a": 0}, {"s": "Halkın kendi kendini yönetmesine ne ad verilir?", "o": ["Monarşi", "Demokrasi", "Oligarşi", "Meşrutiyet", "Meşruti Monarşi"], "a": 1}, {"s": "Devletin bir kurumu tarafından yönetimin zorla ele geçirilmesine ne ad verilir?", "o": ["Devrim", "İnkılap", "İhtilâl", "İsyan", "Darbe"], "a": 4}]}, {"t": "Osmanlı’nın Gerileme ve Çöküş Nedenleri", "q": [{"s": "Aşağıdakilerden hangisi Osmanlı Devleti’nin çöküş nedenlerinden biri değildir?", "o": ["Büyük devletlerin Osmanlı’ya olan düşmanlıkları", "Coğrafi Keşifler", "Kapitülasyonlar", "Büyük devletlerin yardımları", "Ordunun bozulması"], "a": 3}, {"s": "Osmanlı Devleti hangi özelliği ile Fransız İhtilali’nden olumsuz yönde daha çok etkilenmiştir?", "o": ["Eğitimde dinsel anlayış", "Tarım ekonomisine sahip olması", "Çok uluslu bir yapıya sahip olması", "Ordunun bozulması", "Adalet ve hoşgörü anlayışı"], "a": 2}, {"s": "Osmanlı Devleti’nin 18. yüzyılın ilk yıllarında bazı Avrupa devletleriyle yaptığı savaşların genel nedeni aşağıdakilerden hangisidir?", "o": ["Toprak ele geçirme sevdası", "Ulusçu ayaklanmaların başlaması", "Savaş ganimeti elde etmek istemesi", "İngiltere’nin desteğini sağlamak istemesi", "Kaybettiği toprakları geri alma düşüncesi"], "a": 4}, {"s": "Aşağıdakilerden hangisi, Osmanlı Devleti’nin duraklamasının ekonomik nedenlerinden biri değildir?", "o": ["Saray masraflarının artması", "Ordu ve donanmanın bozulması", "Paranın ayarının düşürülmesi", "Akdeniz limanlarının önemini kaybetmesi", "Altın ve gümüş sıkıntısının yaşanması"], "a": 1}, {"s": "Aşağıdakilerden hangisi Osmanlı Devleti’ni olumsuz yönde etkilememiştir?", "o": ["Rönesans hareketleri", "Fransız İhtilali", "Reform hareketleri", "Coğrafi keşifler", "Mali darboğaz"], "a": 2}, {"s": "Aşağıdakilerden hangisi Osmanlı Devlet yönetiminin bozulması ile ilgili değildir?", "o": ["Rüşvetin artması", "Şehzadelerin sancağa gönderilmesi", "Saray giderlerinin artması", "Kadınların devlet yönetimine karışması", "Askerlerin isyan etmeleri"], "a": 1}, {"s": "Osmanlı Devleti 1856 Paris Antlaşması’yla Batı’ya karşı güçsüzlüğünü kabul etmiştir. Paris Antlaşmasının hangi koşulu buna örnek olarak gösterilebilir?", "o": ["Toprak bütünlüğü Avrupa’nın garantisi altında olacaktır", "Karadeniz tarafsız bir deniz olacaktır", "Rusya Balkanlardaki hakimiyetini kaybedecektir", "Azınlıklara ek ayrıcalıklar verilecektir.", "Savaşta İngilizlere asker verecektir."], "a": 0}, {"s": "Osmanlı toprak bütünlüğünü korumayı genel bir siyaset haline getirmiş olan İngiltere, Mısır’ı ve Kıbrıs’ı işgal etmiştir. Bu durum aşağıdakilerden hangisinin bir göstergesi olamaz?", "o": ["İngiltere’nin görüşlerinin değiştiğinin", "Akdeniz’in güvenliğini korumak istemelerinin", "İngiltere ve Fransa arasında rekabetin artmasının", "Bölge halklarının Osmanlı’yı istememelerinin", "İngiltere ile Almanya’nın karşı karşıya kalmasının"], "a": 3}, {"s": "Berlin-Bağdat Demiryolu Projesi ile Almanya özellikle neyi amaçlamıştır?", "o": ["Osmanlıya yardım etmeyi", "Akdeniz’e inmeyi", "İngiltere’nin çıkarlarını baltalamayı", "Fransa ile ortak hareket etmeyi", "Yer altı kaynaklarından yararlanmayı"], "a": 2}, {"s": "Osmanlı Devleti’nin son dönemlerinde padişahların güçlü bir yönetim tarzı sergileyemedikleri görülmektedir. Bunun en önemli nedenlerinden biri aşağıdakilerden hangisidir?", "o": ["Sayıca çok fazla olmalarından", "Devlet yönetimi ile ilgili iyi yetişmemelerinden", "Savaşlara ordunun başında gitmemelerinden", "Aralarında kardeş kavgaları vermelerinden", "Padişah annelerinin hırslı tutumlarından"], "a": 1}]}, {"t": "III. Selim Dönemi", "q": [{"s": "Avrupa’ya gönderilen ilk daimi elçimiz kimdir ve nereye gönderilmiştir?", "o": ["Yusuf Agah Efendi- Paris", "Yirmi Sekiz Çelebi Mehmet Efendi- Londra", "Yusuf Agah Efendi- Londra", "Yirmi Sekiz Çelebi Mehmet Efendi- Paris", "Seyid Ali Efendi-Viyana"], "a": 2}, {"s": "I. İlk daimi elçilikler açıldı\nII. İlk devlet matbaası kuruldu\nIII. Müsadere (mala el koyma) sistemi kaldırıldı\nIV. Memurlara fes giyme zorunluluğu getirildi\nV. Avrupa’ya ilk kez öğrenci gönderildi\nYukarıdaki yapılan ıslahatlardan hangisi yada hangileri III. Selim Dönemi’ne aittir?", "o": ["Yalnız I", "I-II", "I-III-V", "II-IV-V", "I-II-III-IV-V"], "a": 1}, {"s": "Aşağıdakilerden hangisi III. Selim döneminde yapılan ıslahatlar arasında gösterilemez?", "o": ["Avrupa’dan uzmanlar getirildi", "Nizam-ı Cedid Ordusu kuruldu", "Yerli malı kullanımı özendirildi", "İlk geçici elçilikler açıldı", "İlk devlet matbaasının kuruldu"], "a": 3}, {"s": "Mühendishane-i Berr-i Hümayun hangi Osmanlı padişahı zamanında açılmıştır ?", "o": ["II. Mahmut", "III. Mustafa", "III. Selim", "II. Abdülhamit", "I. Mahmut"], "a": 2}, {"s": "İlk devlet matbaası olan Matbaa-i Amire hangi Osmanlı padişahı tarafından kurulmuştur?", "o": ["III. Selim", "IV.Murat", "III.Ahmet", "II. Mahmut", "III. Mustafa"], "a": 0}, {"s": "Aşağıdaki olaylardan hangisi III. Selim dönemine ait değildir?", "o": ["Eşkinci Ocağı", "Mısır’ın işgal edilmesi", "Ziştovi Antlaşması’nın imzalanması", "Yaş Antlaşması", "Irad-ı Cedid hazinesinin kurulması"], "a": 0}, {"s": "III. Selim dönemine son veren olay aşağıdakilerden hangisidir?", "o": ["Alemdar Mustafa Paşa İsyanı", "Şahkulu İsyanı", "Kabakçı Mustafa Paşa İsyanı", "Celali İsyanları", "Eyalet İsyanları"], "a": 2}, {"s": "Nizam-ı Cedid ordusu ilk askeri başarısını hangi devlete karşı kazanmıştır?", "o": ["Rusya", "İngiltere", "Fransa", "Avusturya", "Prusya"], "a": 2}, {"s": "Osmanlı Devleti topraklarının paylaşılması amacıyla Rusya ile Avusturya’nın hazırlamış olduğu plan aşağıdakilerden hangisidir?", "o": ["Nizam-ı Alem", "Frenk", "Gap", "Grek", "Kırım"], "a": 3}]}, {"t": "II. Mahmut, Tanzimat ve Islahat", "q": [{"s": "Gayrimüslimlere Müslümanlara verilen haklardan daha fazlası aşağıdakilerden hangisiyle verilmiştir?", "o": ["Tanzimat Fermanı", "Kanun-ı Esasi", "Islahat Fermanı", "Sened-i İttifak", "Paris Antlaşması"], "a": 2}, {"s": "Osmanlı Devleti’nde halkın yapılan ıslahatlara karşı ilgisiz kalması aşağıdakilerden hangi duruma neden olmuştur?", "o": ["Askeri otoritenin gücünü kaybetmesine", "Yabancıların içişlerine müdahalesinin azalmasına", "Yenilik taraftarlarının güç kazanmasına", "Yeniliklerin kısa ömürlü olmasına", "Ayaklanmaların azalmasına"], "a": 3}, {"s": "Aşağıdakilerden hangisi II.Mahmut döneminde yapılan ıslahatlardan birisi değildir?", "o": ["Nüfus sayımının yapılması", "Yeni bir ordu kurulması", "Resmi Gazete’nin yayımlanması", "İlköğretimin zorunlu olması", "Anayasal düzene geçilmesi"], "a": 4}, {"s": "Osmanlı Devleti XVIII.yy’dan itibaren;\nI. Tarım II. Askerlik III.Teknik IV.Yönetim\nalanlarının hangilerinde Avrupa’nın üstünlüğünü kabul etmiş ve bu alanda Avrupalılardan yararlanmaya başlamıştır?", "o": ["I ve II", "I ve III", "II ve III", "I ve IV", "II ve IV"], "a": 2}, {"s": "Aşağıdakilerden hangisi Islahat Fermanı’nın ilan edilme nedenlerinden birisi değildir?", "o": ["Osmanlı Devleti’nin dağılmasını önleme düşüncesi", "Ayanların padişah üzerindeki baskısı", "Tanzimat Fermanı’nda istenilen yararın sağlanamamış olması", "Avrupa’nın Osmanlı iç işlerine karışmasına engel olunmak istenmesi", "Islahatların yapılması konusunda Avrupa’nın baskısı"], "a": 1}, {"s": "Osmanlı Devleti’nde eğitim, hukuk ve ordu gibi kurumlarda geleneksel yapının devam etmesiyle birlikte batı tarzında yenilik uygulamalarının da yapılması aşağıdakilerden hangisine neden olmuştur?", "o": ["Toplumda çatışmaların artmasına", "Siyasal yapının güçlenmesine", "Devletin sınırlarının genişlemesine", "Vergilerin arttırılmasına", "Azınlıkların devlete daha bağlı hale gelmesine"], "a": 0}, {"s": "Osmanlı Devletinde bütün halka eşit hukuk ilkesi ilk kez aşağıdakilerden hangisiyle birlikte getirilmiştir?", "o": ["Sened-i İttifak", "I. Meşrutiyet", "Lale Devri", "II. Meşrutiyet", "Tanzimat Fermanı"], "a": 4}]}, {"t": "I. ve II. Meşrutiyet", "q": [{" const L='ABCDE',app=document.getElementById('app');
const E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let qs=[],i=0,ans=[],key='';
const best=k=>{try{return localStorage.getItem('b'+k)}catch(e){return null}};
const setBest=(k,v)=>{try{localStorage.setItem('b'+k,v)}catch(e){}};
const card=(k,t,n)=>{const b=best(k);return `<button class="sec" onclick="start('${k}')"><b>${E(t)}</b><span>${n} soru${b?' · en iyi: '+b+'/'+n:''}</span></button>`};
function home(){
  app.innerHTML=`<h1>Değerlendirme Soruları</h1><p class="mu">Bir bölüm seç ve soruları tek tek çöz. Şıkkı işaretleyince doğru ya da yanlış hemen görünür.</p>
  <label class="sh"><input type="checkbox" id="shuf"> Soruları karıştır</label><div class="grid">`+
  D.map((s,k)=>card(k,s.t,s.q.length)).join('')+card('all','Tüm sorular',D.reduce((n,s)=>n+s.q.length,0))+'</div>';
}
function start(k){
  const sh=document.getElementById('shuf').checked;key=k;
  let a=k==='all'?D.flatMap((s,x)=>s.q.map((q,y)=>({...q,n:`${x+1}. bölüm · Soru ${y+1}`}))):D[k].q.map((q,y)=>({...q,n:`${D[k].t} · Soru ${y+1}`}));
  if(sh)a.sort(()=>Math.random()-.5);
  begin(a);
}
function begin(a){qs=a;i=0;ans=a.map(()=>-1);show()}
const nOk=()=>ans.filter((x,j)=>x===qs[j].a).length;
function show(){
  const q=qs[i],d=ans[i]>=0;
  app.innerHTML=`<div class="top"><button class="ghost" onclick="home()">← Bölümler</button><span class="mu">${ans.filter(x=>x>=0).length}/${qs.length} cevaplandı · ${nOk()} doğru</span></div>
  <div class="dots">${qs.map((_,j)=>`<button class="dot ${j===i?'cur':''} ${ans[j]<0?'':ans[j]===qs[j].a?'ok':'no'}" onclick="go(${j})">${j+1}</button>`).join('')}</div>
  <div class="card"><div class="mu">${E(q.n)}</div><div class="stem">${E(q.s)}</div>
  ${q.o.map((o,j)=>`<button class="opt ${d?(j===q.a?'ok':j===ans[i]?'no':''):''}" ${d?'disabled':''} onclick="pick(${j})"><i>${L[j]}</i><span>${E(o)}</span></button>`).join('')}
  ${d?`<p class="fb ${ans[i]===q.a?'ok':'no'}">${ans[i]===q.a?'Doğru!':'Yanlış. Doğru cevap: '+L[q.a]}</p>`:''}</div>
  <div class="nav"><button class="ghost" onclick="go(i-1)" ${i?'':'disabled'}>← Önceki</button>${i<qs.length-1?'<button class="pri" onclick="go(i+1)">Sonraki →</button>':'<button class="pri" onclick="finish()">Bitir</button>'}</div>`;
}
function go(j){if(j>=0&&j<qs.length){i=j;show();window.scrollTo(0,0)}}
function pick(j){if(ans[i]<0){ans[i]=j;show()}}
function finish(){
  const n=qs.length,ok=nOk(),blank=ans.filter(x=>x<0).length;
  const old=+best(key)||0;if(ok>old&&!blank)setBest(key,ok);
  const wrong=qs.filter((q,j)=>ans[j]!==q.a);
  app.innerHTML=`<h1>Sonuç</h1><div class="big">${ok}/${n}</div><p class="mu">${blank?blank+' soru boş bırakıldı. ':''}%${Math.round(ok/n*100)} başarı</p>
  <div class="row"><button class="pri" onclick="begin(qs.map(q=>q))">Baştan başla</button>${wrong.length?'<button class="ghost" onclick="begin(wrongs())">Yanlışları tekrar çöz</button>':''}<button class="ghost" onclick="home()">Bölümler</button></div>`+
  (wrong.length?'<h2 style="font-size:18px">Yanlış ya da boş sorular</h2>'+qs.map((q,j)=>ans[j]===q.a?'':`<div class="wr"><div class="mu">${E(q.n)}</div>${E(q.s)}<br><b>Doğru: ${L[q.a]}) ${E(q.o[q.a])}</b></div>`).join(''):'<p>Hepsi doğru, tebrikler!</p>');
  window.scrollTo(0,0);
}
const wrongs=()=>qs.filter((q,j)=>ans[j]!==q.a);
document.addEventListener('keydown',e=>{
  if(!qs.length||!document.querySelector('.card'))return;
  const k=e.key.toLowerCase(),x='abcde'.indexOf(k);
  if(x>=0)pick(x);else if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);
});
home();
</script></body></html>
